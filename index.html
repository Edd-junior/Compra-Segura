<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Bootstrap</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://jsdelivr.net"
    rel="stylesheet"
  />

  <style>
    body{
      background:#0f172a;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial, sans-serif;
    }

    .chat-container{
      width:420px;
      height:700px;
      background:#1e293b;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 0 25px rgba(0,0,0,0.4);
      display:flex;
      flex-direction:column;
    }

    .chat-header{
      background:#111827;
      padding:15px;
      color:white;
      display:flex;
      align-items:center;
      gap:12px;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .avatar{
      width:50px;
      height:50px;
      border-radius:50%;
      background:#38bdf8;
      display:flex;
      justify-content:center;
      align-items:center;
      font-weight:bold;
      color:white;
      font-size:20px;
    }

    .chat-messages{
      flex:1;
      padding:20px;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .message{
      max-width:75%;
      padding:12px 16px;
      border-radius:16px;
      color:white;
      font-size:14px;
      word-break: break-all; /* Evita que links longos quebrem o layout */
    }

    .received{
      background:#334155;
      align-self:flex-start;
      border-bottom-left-radius:5px;
    }

    .sent{
      background:#0ea5e9;
      align-self:flex-end;
      border-bottom-right-radius:5px;
    }

    .chat-input{
      padding:15px;
      background:#111827;
      border-top:1px solid rgba(255,255,255,0.1);
    }

    .form-control{
      background:#1e293b;
      border:none;
      color:white;
    }

    .form-control:focus{
      background:#1e293b;
      color:white;
      box-shadow:none;
    }

    .btn-send{
      background:#0ea5e9;
      border:none;
    }

    .btn-send:hover{
      background:#0284c7;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
      <div class="avatar">A</div>

      <div>
        <h6 class="m-0">Arthur Bot</h6>
        <small class="text-success">Analisador Ativo</small>
      </div>
    </div>

    <!-- Mensagens -->
    <div class="chat-messages" id="chatContainer">
      <div class="message received">
        Olá! Envie um texto ou um link de produto para eu analisar. 🤖
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input">
      <div class="input-group">
        <input
          type="text"
          id="messageInput"
          class="form-control"
          placeholder="Digite uma mensagem ou cole um link..."
        >

        <button id="sendButton" class="btn btn-send text-white">
          Enviar
        </button>
      </div>
    </div>

  </div>

  <!-- Script de Conexão com o Python -->
  <script>
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');

    // Função auxiliar para renderizar balões de mensagens
    function renderMessage(text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight; // Rola o chat para o fim
    }

    // Função que faz o envio dos dados para a API Python
    async function handleSendMessage() {
      const messageText = messageInput.value.trim();
      if (!messageText) return;

      // 1. Mostra a mensagem do usuário na tela instantaneamente
      renderMessage(messageText, 'sent');
      messageInput.value = '';

      try {
        // 2. Envia para o back-end em Python
        const response = await fetch('/api/mensagem', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ mensagem: messageText })
        });

        const data = await response.json();
        
        // 3. Exibe o retorno do analisador Python no chat
        renderMessage(data.resposta, 'received');

      } catch (error) {
        renderMessage('⚠️ Erro ao tentar conectar com o servidor Python.', 'received');
        console.error(error);
      }
    }

    // Eventos de clique e tecla Enter
    sendButton.addEventListener('click', handleSendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSendMessage();
    });
  </script>
</body>
</html>
